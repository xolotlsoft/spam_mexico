# ⚠️ DESHABILITADO — SUSTITUIDO POR extraer_alertas_oficiales.yml
#
# Motivo:
#  1. Este workflow usaba datos SIMULADOS (números inventados de BC,
#     Guanajuato y Aguascalientes) y su cron los habría agregado a
#     mexico_spam_db.json, contaminando la base de datos.
#  2. La extracción real de fuentes estatales/oficiales se realiza con
#     scripts/extraer_alertas_oficiales.py, ejecutado DIARIAMENTE por
#     extraer_alertas_oficiales.yml. Baja California (seguridadbc.gob.mx)
#     ya está cubierta por ese pipeline.
#  3. Los portales de Guanajuato (C5i) y Aguascalientes (C5i) no exponen
#     listas estructuradas de números; requieren consulta manual.

name: 'DESHABILITADO - Extraer Números de Gobiernos Estatales'

on:
  workflow_dispatch:  # Solo ejecución manual, sin programación

jobs:
  no-op:
    runs-on: ubuntu-latest
    steps:
      - name: Explicar estado
        run: |
          echo "⚠️ Este workflow fue deshabilitado."
          echo ""
          echo "La extracción real de alertas oficiales (incluyendo Baja California)"
          echo "se ejecuta diariamente en 'Extraer Números de Alertas Oficiales'"
          echo "(extraer_alertas_oficiales.yml), usando scripts/extraer_alertas_oficiales.py."
          echo ""
          echo "Guanajuato y Aguascalientes requieren consulta manual (ver FUENTES.md)."
          exit 0
