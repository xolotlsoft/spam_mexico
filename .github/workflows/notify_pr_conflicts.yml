name: Notificar Conflictos de PR

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  issues: write
  pull-requests: read

jobs:
  notify-pr-conflict:
    runs-on: ubuntu-latest
    steps:
      - name: Notificar conflictos de PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mergeable_state="$(gh api /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }} --jq .mergeable_state)"
          if [ "$mergeable_state" != "dirty" ]; then
            echo "Sin conflictos de merge"
            exit 0
          fi

          issue_title="[Automatización] PR con conflictos: #${{ github.event.pull_request.number }}"
          existing_issue="$(gh issue list --state open --search "$issue_title in:title" --json number --jq '.[0].number')"
          if [ -n "$existing_issue" ] && [ "$existing_issue" != "null" ]; then
            echo "Ya existe el issue #$existing_issue"
            exit 0
          fi

          cat <<'EOF' > /tmp/pr_conflict_issue.md
          Se detectó un conflicto de merge en el PR #${{ github.event.pull_request.number }}.

          - PR: ${{ github.event.pull_request.html_url }}
          - Base: `${{ github.event.pull_request.base.ref }}`

          GitHub Notifications puede avisar al equipo; este issue deja además un rastro visible en el repositorio.
          EOF

          gh issue create \
            --title "$issue_title" \
            --body-file /tmp/pr_conflict_issue.md
