name: Extraer Números de MiraQuienHabla

on:
  schedule:
    - cron: '0 12 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extraer-miraquienhabla
  cancel-in-progress: false

jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 jsonschema

      - name: Ejecutar extracción
        run: |
          python3 - <<'PY'
          import json
          import re
          from datetime import datetime, UTC

          import requests
          from bs4 import BeautifulSoup

          url = "https://miraquienhabla.com.mx/reportes"
          response = requests.get(url, timeout=15)
          response.raise_for_status()
          soup = BeautifulSoup(response.text, "html.parser")

          pattern = re.compile(r"\+52\d{10}")
          numbers = []
          for match in dict.fromkeys(pattern.findall(soup.get_text(" ", strip=True))):
              numbers.append(
                  {
                      "number": match,
                      "reports": 1,
                      "tag": "extorsion",
                      "source": "MiraQuienHabla",
                  }
              )

          with open("mexico_spam_db.json", "r", encoding="utf-8") as file:
              data = json.load(file)

          existing_numbers = {item["number"] for item in data["numbers"]}
          for item in numbers:
              if item["number"] not in existing_numbers:
                  data["numbers"].append(item)
                  existing_numbers.add(item["number"])

          data["updated_at"] = datetime.now(UTC).strftime("%Y-%m-%d")
          data["version"] = "1.2"
          data["description"] = (
              "Base de datos colaborativa de números de extorsión telefónica en México. "
              "Fuentes: MiraQuienHabla, CONDUSEF, Profeco, Reddit, Twitter, gobiernos "
              "estatales y reportes públicos."
          )

          with open("mexico_spam_db.json", "w", encoding="utf-8") as file:
              json.dump(data, file, indent=2, ensure_ascii=False)
              file.write("\n")

          print(f"✅ Se extrajeron {len(numbers)} números de MiraQuienHabla.")
          PY

      - name: Validar JSON antes de publicar
        run: python3 scripts/validate_json.py

      - name: Detectar cambios
        id: changes
        run: |
          if git diff --quiet -- mexico_spam_db.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit y push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add mexico_spam_db.json
          git commit -m "Actualizar números de MiraQuienHabla - $(date -u +'%Y-%m-%d')"
          git push

      - name: Ejecutar validate_json.yml tras la actualización
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/${{ github.repository }}/dispatches \
            -f event_type='validate-json' \
            -F client_payload[source]='extraer_miraquienhabla'
