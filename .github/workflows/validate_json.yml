name: Validate JSON for OpenCallShield

on:
  push:
    paths:
      - 'mexico_spam_db.json'
  pull_request:
    paths:
      - 'mexico_spam_db.json'

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install jsonschema

      - name: Validate JSON structure
        run: |
          python3 -c "
          import json
          from jsonschema import validate, ValidationError

          # Schema esperado para OpenCallShield
          schema = {
              'type': 'object',
              'properties': {
                  'version': {'type': 'string'},
                  'updated_at': {'type': 'string'},
                  'description': {'type': 'string'},
                  'numbers': {
                      'type': 'array',
                      'items': {
                          'type': 'object',
                          'properties': {
                              'number': {'type': 'string', 'pattern': '^\+52\d{10}$'},
                              'reports': {'type': 'integer', 'minimum': 1},
                              'tag': {'type': 'string'},
                              'source': {'type': 'string'}
                          },
                          'required': ['number', 'reports', 'tag', 'source']
                      }
                  }
              },
              'required': ['version', 'updated_at', 'description', 'numbers']
          }

          # Cargar el JSON
          with open('mexico_spam_db.json', 'r') as f:
              data = json.load(f)

          # Validar contra el schema
          try:
              validate(instance=data, schema=schema)
              print('✅ El JSON cumple con el formato esperado para OpenCallShield.')
          except ValidationError as e:
              print(f'❌ Error de validación: {e.message}')
              exit(1)
          "
