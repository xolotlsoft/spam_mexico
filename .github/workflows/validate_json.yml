name: Validate JSON for OpenCallShield

on:
  push:
    paths:
      - 'mexico_spam_db.json'
      - 'scripts/validate_json.py'
      - 'scripts/schema.py'
  pull_request:
    paths:
      - 'mexico_spam_db.json'
      - 'scripts/validate_json.py'
      - 'scripts/schema.py'

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install jsonschema

      - name: Validate JSON structure
        run: python -m scripts.validate_json mexico_spam_db.json
