name: Validate JSON for OpenCallShield

on:
  push:
    paths:
      - 'mexico_spam_db.json'
  pull_request:
    paths:
      - 'mexico_spam_db.json'
  repository_dispatch:
    types:
      - validate-json

permissions:
  contents: read

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install jsonschema

      - name: Validate JSON structure
        run: python3 scripts/validate_json.py
