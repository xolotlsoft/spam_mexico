name: Validate JSON for OpenCallShield

on:
  push:
    paths:
      - 'mexico_spam_db.json'
      - 'scripts/extraer_gobiernos_estatales.py'
  pull_request:
    paths:
      - 'mexico_spam_db.json'
      - 'scripts/extraer_gobiernos_estatales.py'

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install jsonschema

      - name: Validate JSON structure
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from jsonschema import ValidationError, validate

          schema = {
              'type': 'object',
              'properties': {
                  'version': {'type': 'string'},
                  'updated_at': {'type': 'string'},
                  'description': {'type': 'string'},
                  'numbers': {
                      'type': 'array',
                      'items': {
                          'type': 'object',
                          'properties': {
                              'number': {'type': 'string', 'pattern': '^\\+52\\d{10}$'},
                              'reports': {'type': 'integer', 'minimum': 1},
                              'tag': {'type': 'string', 'enum': ['extorsion', 'fraude', 'spam']},
                              'source': {'type': 'string'}
                          },
                          'required': ['number', 'reports', 'tag', 'source'],
                          'additionalProperties': False
                      }
                  }
              },
              'required': ['version', 'updated_at', 'description', 'numbers'],
              'additionalProperties': False
          }

          with open('mexico_spam_db.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          validate(instance=data, schema=schema)
          numbers = [item['number'] for item in data['numbers']]
          duplicates = sorted(number for number, count in Counter(numbers).items() if count > 1)
          if duplicates:
              raise ValidationError(f'Números duplicados detectados: {", ".join(duplicates)}')

          print('✅ El JSON cumple con el formato esperado para OpenCallShield y no contiene duplicados.')
          PY
