name: Extraer Números de Alertas Oficiales

# Ejecución diaria (reemplaza el flujo de Reddit/Twitter, no soportado).
# Fuentes reales: Baja California, CONDUSEF, Profeco/SSPC (gob.mx).
# Script: scripts/extraer_alertas_oficiales.py

on:
  schedule:
    - cron: '0 8 * * *'  # Diario a las 08:00 UTC
  workflow_dispatch:  # Permitir ejecución manual

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 PyPDF2 jsonschema

      - name: Ejecutar extracción de alertas oficiales
        run: python3 scripts/extraer_alertas_oficiales.py

      - name: Commit y push (solo si hay cambios)
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add mexico_spam_db.json
          if git diff --cached --quiet; then
            echo "ℹ️ Sin cambios; nada que confirmar."
          else
            git commit -m "Actualizar números desde alertas oficiales - $(date -u +%F)"
            git push
          fi
