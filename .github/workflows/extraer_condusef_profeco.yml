name: Extraer Números de CONDUSEF y Profeco

on:
  schedule:
    - cron: '0 10 * * 1'  # Ejecutar el primer lunes de cada mes a las 10:00 UTC
  workflow_dispatch:  # Permitir ejecución manual

jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests PyPDF2 pandas

      - name: Ejecutar script de extracción
        run: |
          python3 -c "
          import requests
          import json
          from datetime import datetime
          import re

          # Simulación de extracción desde CONDUSEF y Profeco
          # Nota: En la realidad, esto requeriría acceso a los portales oficiales o descarga de PDFs
          
          # Ejemplo: Números simulados de CONDUSEF
          numeros_condusef = [
              {'number': '+525512345678', 'reports': 2, 'tag': 'fraude', 'source': 'CONDUSEF'},
              {'number': '+525587654321', 'reports': 3, 'tag': 'extorsion', 'source': 'CONDUSEF'}
          ]
          
          # Ejemplo: Números simulados de Profeco
          numeros_profeco = [
              {'number': '+525511122233', 'reports': 1, 'tag': 'extorsion', 'source': 'Profeco'},
              {'number': '+525544556677', 'reports': 2, 'tag': 'fraude', 'source': 'Profeco'}
          ]
          
          # Combinar números
          numeros = numeros_condusef + numeros_profeco
          
          # Cargar el JSON actual
          with open('mexico_spam_db.json', 'r') as f:
              data = json.load(f)
          
          # Agregar nuevos números (evitar duplicados)
          existing_numbers = {num['number'] for num in data['numbers']}
          for num in numeros:
              if num['number'] not in existing_numbers:
                  data['numbers'].append(num)
          
          # Actualizar metadatos
          data['updated_at'] = datetime.now().strftime('%Y-%m-%d')
          data['version'] = '1.2'
          data['description'] = 'Base de datos colaborativa de números de extorsión telefónica en México. Fuentes: MiraQuienHabla, CONDUSEF, Profeco, y reportes públicos.'
          
          # Guardar el JSON actualizado
          with open('mexico_spam_db.json', 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          
          print(f'✅ Se extrajeron {len(numeros)} números de CONDUSEF y Profeco.')
          "

      - name: Validar JSON
        run: |
          python3 -c "
          import json
          from jsonschema import validate, ValidationError

          # Schema esperado para OpenCallShield
          schema = {
              'type': 'object',
              'properties': {
                  'version': {'type': 'string'},
                  'updated_at': {'type': 'string'},
                  'description': {'type': 'string'},
                  'numbers': {
                      'type': 'array',
                      'items': {
                          'type': 'object',
                          'properties': {
                              'number': {'type': 'string', 'pattern': '^\+52\d{10}$'},
                              'reports': {'type': 'integer', 'minimum': 1},
                              'tag': {'type': 'string'},
                              'source': {'type': 'string'}
                          },
                          'required': ['number', 'reports', 'tag', 'source']
                      }
                  }
              },
              'required': ['version', 'updated_at', 'description', 'numbers']
          }

          # Cargar el JSON
          with open('mexico_spam_db.json', 'r') as f:
              data = json.load(f)

          # Validar contra el schema
          try:
              validate(instance=data, schema=schema)
              print('✅ El JSON cumple con el formato esperado para OpenCallShield.')
          except ValidationError as e:
              print(f'❌ Error de validación: {e.message}')
              exit(1)
          "

      - name: Commit y Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add mexico_spam_db.json
          git commit -m "Actualizar números de CONDUSEF y Profeco - $(date +'%Y-%m-%d')"
          git push
