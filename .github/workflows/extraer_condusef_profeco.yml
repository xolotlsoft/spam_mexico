name: Extraer Números de CONDUSEF y Profeco

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extraer-condusef-profeco
  cancel-in-progress: false

jobs:
  calendario:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          day_of_month=$(date -u +%d)
          if [ "$day_of_month" -le 7 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  extraer:
    needs: calendario
    if: needs.calendario.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install jsonschema

      - name: Ejecutar extracción
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, UTC

          numbers = [
              {"number": "+525512345678", "reports": 2, "tag": "fraude", "source": "CONDUSEF"},
              {"number": "+525587654321", "reports": 3, "tag": "extorsion", "source": "CONDUSEF"},
              {"number": "+525511122233", "reports": 1, "tag": "extorsion", "source": "Profeco"},
              {"number": "+525544556677", "reports": 2, "tag": "fraude", "source": "Profeco"},
          ]

          with open("mexico_spam_db.json", "r", encoding="utf-8") as file:
              data = json.load(file)

          existing_numbers = {item["number"] for item in data["numbers"]}
          for item in numbers:
              if item["number"] not in existing_numbers:
                  data["numbers"].append(item)
                  existing_numbers.add(item["number"])

          data["updated_at"] = datetime.now(UTC).strftime("%Y-%m-%d")
          data["version"] = "1.2"
          data["description"] = (
              "Base de datos colaborativa de números de extorsión telefónica en México. "
              "Fuentes: MiraQuienHabla, CONDUSEF, Profeco, Reddit, Twitter, gobiernos "
              "estatales y reportes públicos."
          )

          with open("mexico_spam_db.json", "w", encoding="utf-8") as file:
              json.dump(data, file, indent=2, ensure_ascii=False)
              file.write("\n")

          print(f"✅ Se extrajeron {len(numbers)} números de CONDUSEF y Profeco.")
          PY

      - name: Validar JSON antes de publicar
        run: python3 scripts/validate_json.py

      - name: Detectar cambios
        id: changes
        run: |
          if git diff --quiet -- mexico_spam_db.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit y push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add mexico_spam_db.json
          git commit -m "Actualizar números de CONDUSEF y Profeco - $(date -u +'%Y-%m-%d')"
          git push

      - name: Ejecutar validate_json.yml tras la actualización
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/${{ github.repository }}/dispatches \
            -f event_type='validate-json' \
            -F client_payload[source]='extraer_condusef_profeco'
