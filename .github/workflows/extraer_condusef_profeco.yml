# ⚠️ DESHABILITADO — SUSTITUIDO POR extraer_alertas_oficiales.yml
#
# Motivo:
#  1. Este workflow usaba datos SIMULADOS y su cron semanal los habría
#     agregado a mexico_spam_db.json, contaminando la base de datos.
#  2. La extracción real de CONDUSEF/Profeco se realiza ahora con
#     scripts/extraer_alertas_oficiales.py, ejecutado DIARIAMENTE por
#     extraer_alertas_oficiales.yml (portal de números sospechosos,
#     comunicados de prensa en PDF y artículos en gob.mx).
#
# Nota: el cron original ('0 10 * * 1') se ejecutaba TODOS los lunes,
# no solo el primero de mes como indicaba el comentario anterior.

name: 'DESHABILITADO - Extraer Números de CONDUSEF y Profeco'

on:
  workflow_dispatch:  # Solo ejecución manual, sin programación

jobs:
  no-op:
    runs-on: ubuntu-latest
    steps:
      - name: Explicar estado
        run: |
          echo "⚠️ Este workflow fue deshabilitado."
          echo ""
          echo "La extracción real de CONDUSEF/Profeco se ejecuta diariamente en"
          echo "'Extraer Números de Alertas Oficiales' (extraer_alertas_oficiales.yml),"
          echo "usando scripts/extraer_alertas_oficiales.py."
          exit 0
